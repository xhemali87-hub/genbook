<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genbook PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

<header class="bg-white shadow p-4 flex justify-between">
  <h1 class="font-bold">Genbook 🌳 PRO</h1>
  <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-4 grid md:grid-cols-2 gap-6">

<!-- LEFT -->
<div class="space-y-4">

<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-2">Famille</h2>
  <input id="familyName" placeholder="Nom famille" class="border p-2 w-full mb-2">
  <button onclick="createFamily()" class="bg-blue-600 text-white w-full p-2 mb-2">Créer</button>

  <input id="familyCode" placeholder="Code" class="border p-2 w-full mb-2">
  <button onclick="joinFamily()" class="bg-green-600 text-white w-full p-2">Rejoindre</button>
</div>

<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-2">Ajouter personne</h2>

  <input id="prenom" placeholder="Prénom" class="border p-2 w-full mb-2">
  <input id="nom" placeholder="Nom" class="border p-2 w-full mb-2">
  <input id="naissance" type="date" class="border p-2 w-full mb-2">

  <select id="sexe" class="border p-2 w-full mb-2">
    <option value="">Sexe</option>
    <option value="Homme">Homme</option>
    <option value="Femme">Femme</option>
  </select>

  <select id="typeAjout" class="border p-2 w-full mb-2">
    <option value="">Type relation</option>
    <option value="root">Personne racine</option>
    <option value="child">Enfant</option>
    <option value="spouse">Conjoint</option>
    <option value="sibling">Frère / sœur</option>
  </select>

  <select id="target" class="border p-2 w-full mb-2">
    <option value="">Personne liée</option>
  </select>

  <button onclick="addPerson()" class="bg-purple-600 text-white w-full p-2">Ajouter</button>
</div>

</div>

<!-- RIGHT TREE -->
<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-4">Arbre</h2>
  <div id="tree"></div>
</div>

</main>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
  authDomain: "genbook-2ea8a.firebaseapp.com",
  projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userId = null;
let currentFamilyId = null;
let members = [];

function logout(){ auth.signOut(); }

function generateCode(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }

auth.onAuthStateChanged(user => {
  if(user){
    userId = user.uid;
    loadUser();
  }
});

function createFamily(){
  const name = familyName.value;
  const code = generateCode();
  db.collection("families").add({ name, code }).then(doc=>{
    currentFamilyId = doc.id;
    db.collection("users").doc(userId).set({ familyId: doc.id });
    alert("Code famille: " + code);
  });
}

function joinFamily(){
  db.collection("families").where("code","==",familyCode.value).get().then(s=>{
    s.forEach(doc=>{
      currentFamilyId = doc.id;
      db.collection("users").doc(userId).set({ familyId: doc.id });
      loadMembers();
    });
  });
}

function loadUser(){
  db.collection("users").doc(userId).get().then(doc=>{
    if(doc.exists){
      currentFamilyId = doc.data().familyId;
      loadMembers();
    }
  });
}

function addPerson(){
  const data = {
    familyId: currentFamilyId,
    prenom: prenom.value,
    nom: nom.value,
    naissance: naissance.value,
    sexe: sexe.value,
    fatherId: null,
    motherId: null
  };

  const type = typeAjout.value;
  const targetId = target.value;

  if(type === "root"){
    db.collection("members").add(data);
  }

  if(type === "child" && targetId){
    const parent = members.find(m => m.id === targetId);

    if(parent.sexe === "Homme") data.fatherId = parent.id;
    if(parent.sexe === "Femme") data.motherId = parent.id;

    db.collection("members").add(data);
  }

  if(type === "sibling" && targetId){
    const sibling = members.find(m => m.id === targetId);
    data.fatherId = sibling.fatherId;
    data.motherId = sibling.motherId;

    db.collection("members").add(data);
  }

  if(type === "spouse" && targetId){
    db.collection("relationships").add({
      person1: targetId,
      person2: null,
      type: "couple",
      prenom: data.prenom,
      nom: data.nom
    });
  }
}

function loadMembers(){
  db.collection("members").where("familyId","==",currentFamilyId)
  .onSnapshot(snapshot=>{
    members = [];
    target.innerHTML = '<option value="">Personne liée</option>';

    snapshot.forEach(doc=>{
      const d = doc.data();
      d.id = doc.id;
      members.push(d);

      const opt = document.createElement('option');
      opt.value = doc.id;
      opt.textContent = d.prenom + ' ' + d.nom;
      target.appendChild(opt);
    });

    renderTree();
  });
}

function calculAge(date){
  if(!date) return '';
  const t = new Date();
  const d = new Date(date);
  let age = t.getFullYear() - d.getFullYear();
  return age + ' ans';
}

function renderTree(){
  tree.innerHTML = '';

  const roots = members.filter(m => !m.fatherId && !m.motherId);

  roots.forEach(root => {
    tree.innerHTML += buildNode(root);
  });
}

function buildNode(m){
  const children = members.filter(c => c.fatherId === m.id || c.motherId === m.id);

  let html = `<div class='ml-4 border-l pl-3'>
    <div class='bg-blue-100 p-2 rounded mb-1'>
      <strong>${m.prenom} ${m.nom}</strong><br>
      ${calculAge(m.naissance)} - ${m.sexe}
    </div>`;

  children.forEach(c => {
    html += buildNode(c);
  });

  html += '</div>';
  return html;
}

</script>

</body>
</html>
