<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 shadow flex justify-between">
<h1 class="font-bold">Genbook 🌳 PRO</h1>
</header>

<main class="p-6 flex flex-col items-center gap-4">

<input id="familyName" placeholder="Nom de famille"
class="border p-2 w-64">

<button onclick="createFamily()" class="bg-blue-600 text-white px-4 py-2 rounded">
Créer famille
</button>

<div id="tree" class="mt-6"></div>

</main>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let familyId = null;
let members = [];

/* CREATE FAMILY */
async function createFamily(){

const name = document.getElementById("familyName").value;

if(!name){
alert("Nom obligatoire");
return;
}

const fam = await db.collection("families").add({name});
familyId = fam.id;

/* CREATE ROOT */
await db.collection("members").add({
familyId,
prenom: name,
root: true
});

load();

}

/* LOAD */
async function load(){

const snap = await db.collection("members")
.where("familyId","==",familyId)
.get();

members = snap.docs.map(d=>({id:d.id,...d.data()}));

render();

}

/* MENU */
function menu(id){

const action = prompt(
`1 Père
2 Mère
3 Garçon
4 Fille
5 Conjoint
6 Frère / sœur`
);

if(!action) return;

if(action==1) addParent(id,"father");
if(action==2) addParent(id,"mother");
if(action==3) addChild(id,"garcon");
if(action==4) addChild(id,"fille");
if(action==5) addSpouse(id);
if(action==6) addSibling(id);

}

/* ADD PARENT */
async function addParent(id,type){

const name = prompt("Nom ?");
if(!name) return;

await db.collection("members").add({
familyId,
prenom:name,
childOf:id,
role:type
});

load();

}

/* ADD CHILD */
async function addChild(id,type){

const name = prompt("Nom ?");
if(!name) return;

await db.collection("members").add({
familyId,
prenom:name,
parent:id,
role:type
});

load();

}

/* ADD SPOUSE */
async function addSpouse(id){

const name = prompt("Nom conjoint ?");
if(!name) return;

await db.collection("members").add({
familyId,
prenom:name,
spouseOf:id
});

load();

}

/* ADD SIBLING */
async function addSibling(id){

const name = prompt("Nom ?");
if(!name) return;

await db.collection("members").add({
familyId,
prenom:name,
siblingOf:id
});

load();

}

/* RENDER */
function render(){

const tree = document.getElementById("tree");
tree.innerHTML = "";

members.forEach(m=>{
tree.innerHTML += `
<div onclick="menu('${m.id}')"
class="bg-white p-3 m-2 rounded shadow cursor-pointer inline-block hover:bg-blue-100">
👤 ${m.prenom}
</div>
`;
});

}

</script>

</body>
</html>
