<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genbook - Arbre</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<header class="bg-white shadow p-4 flex justify-between">
  <h1 class="font-bold">Genbook 🌳</h1>
  <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-4 grid md:grid-cols-2 gap-6">

<!-- LEFT PANEL -->
<div class="space-y-4">

<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-2">Famille</h2>
  <input id="familyName" placeholder="Nom famille" class="border p-2 w-full mb-2">
  <button onclick="createFamily()" class="bg-blue-600 text-white w-full p-2 mb-2">Créer</button>

  <input id="familyCode" placeholder="Code" class="border p-2 w-full mb-2">
  <button onclick="joinFamily()" class="bg-green-600 text-white w-full p-2">Rejoindre</button>
</div>

<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-2">Ajouter membre</h2>
  <input id="name" placeholder="Nom" class="border p-2 w-full mb-2">
  <input id="role" placeholder="Rôle" class="border p-2 w-full mb-2">
  <select id="parent" class="border p-2 w-full mb-2">
    <option value="">Parent (optionnel)</option>
  </select>
  <button onclick="addMember()" class="bg-purple-600 text-white w-full p-2">Ajouter</button>
</div>

</div>

<!-- RIGHT PANEL (TREE) -->
<div class="bg-white p-4 rounded-xl shadow">
  <h2 class="font-bold mb-4">Arbre familial</h2>
  <div id="tree" class="space-y-2"></div>
</div>

</main>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
  authDomain: "genbook-2ea8a.firebaseapp.com",
  projectId: "genbook-2ea8a",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userId = null;
let currentFamilyId = null;
let members = [];

function logout(){ auth.signOut(); }

function generateCode(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }

function signup(){ auth.createUserWithEmailAndPassword(email.value, password.value); }
function login(){ auth.signInWithEmailAndPassword(email.value, password.value); }

auth.onAuthStateChanged(user => {
  if(user){
    userId = user.uid;
    loadUser();
  }
});

function createFamily(){
  const name = document.getElementById('familyName').value;
  const code = generateCode();
  db.collection("families").add({ name, code }).then(doc=>{
    currentFamilyId = doc.id;
    db.collection("users").doc(userId).set({ familyId: doc.id });
    alert("Code famille: " + code);
    loadMembers();
  });
}

function joinFamily(){
  const code = document.getElementById('familyCode').value;
  db.collection("families").where("code","==",code).get().then(s=>{
    s.forEach(doc=>{
      currentFamilyId = doc.id;
      db.collection("users").doc(userId).set({ familyId: doc.id });
      loadMembers();
    });
  });
}

function loadUser(){
  db.collection("users").doc(userId).get().then(doc=>{
    if(doc.exists){
      currentFamilyId = doc.data().familyId;
      loadMembers();
    }
  });
}

function addMember(){
  const name = document.getElementById('name').value;
  const role = document.getElementById('role').value;
  const parent = document.getElementById('parent').value;

  db.collection("members").add({
    familyId: currentFamilyId,
    name,
    role,
    parent
  });
}

function loadMembers(){
  db.collection("members").where("familyId","==",currentFamilyId)
  .onSnapshot(snapshot=>{
    members = [];
    const select = document.getElementById('parent');
    select.innerHTML = '<option value="">Parent</option>';

    snapshot.forEach(doc=>{
      const d = doc.data();
      d.id = doc.id;
      members.push(d);

      const opt = document.createElement('option');
      opt.value = doc.id;
      opt.textContent = d.name;
      select.appendChild(opt);
    });

    renderTree();
  });
}

function renderTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  const roots = members.filter(m => !m.parent);

  roots.forEach(root => {
    const div = document.createElement('div');
    div.innerHTML = buildNode(root);
    tree.appendChild(div);
  });
}

function buildNode(member){
  const children = members.filter(m => m.parent === member.id);

  let html = `<div class='ml-2 border-l pl-2'>
    <div class='bg-blue-100 p-2 rounded'>${member.name} (${member.role})</div>`;

  children.forEach(child => {
    html += buildNode(child);
  });

  html += `</div>`;
  return html;
}

</script>

</body>
</html>

</html>
