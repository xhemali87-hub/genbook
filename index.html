<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 shadow flex justify-between">
<h1 class="font-bold">Genbook 🌳</h1>
<button onclick="createFamily()" class="bg-blue-600 text-white px-3 py-1 rounded">
Créer famille
</button>
</header>

<main class="p-6 flex justify-center">
<div id="tree" class="w-full max-w-4xl"></div>
</main>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* STATE */
let familyId = null;
let members = [];

/* CREATE FAMILY */
async function createFamily(){
const doc = await db.collection("families").add({});
familyId = doc.id;
loadMembers();
}

/* LOAD MEMBERS */
async function loadMembers(){

if(!familyId) return;

const snap = await db.collection("members")
.where("familyId","==",familyId)
.get();

members = snap.docs.map(d=>({id:d.id,...d.data()}));

render();

}

/* ADD ROOT */
async function addRoot(){
await db.collection("members").add({
familyId,
prenom:"Moi"
});
loadMembers();
}

/* ADD SPOUSE */
async function addSpouse(id){

const name = prompt("Nom conjoint ?");
if(!name) return;

const ref = await db.collection("members").add({
familyId,
prenom:name
});

await db.collection("couples").add({
familyId,
person1:id,
person2:ref.id
});

loadMembers();
}

/* ADD CHILD */
async function addChild(id){

const name = prompt("Nom enfant ?");
if(!name) return;

const couples = await db.collection("couples")
.where("familyId","==",familyId)
.get();

let coupleId = null;

couples.forEach(c=>{
const d=c.data();
if(d.person1===id || d.person2===id){
coupleId = c.id;
}
});

if(!coupleId){
alert("Ajoute un conjoint d'abord");
return;
}

await db.collection("children").add({
coupleId,
prenom:name
});

loadMembers();
}

/* RENDER */
async function render(){

const tree = document.getElementById("tree");
tree.innerHTML = "";

/* NO DATA */
if(members.length===0){
tree.innerHTML = `
<button onclick="addRoot()" class="bg-blue-500 text-white px-4 py-2 rounded">
Créer personne racine
</button>`;
return;
}

/* GET COUPLES */
const couplesSnap = await db.collection("couples")
.where("familyId","==",familyId)
.get();

/* DISPLAY */
for(const doc of couplesSnap.docs){

const c = doc.data();

const p1 = members.find(m=>m.id===c.person1);
const p2 = members.find(m=>m.id===c.person2);

let html = `
<div class="bg-white p-4 rounded shadow mb-6">

<div class="flex gap-4 justify-center mb-3">

<div class="bg-blue-200 px-4 py-2 rounded cursor-pointer"
onclick="menu('${p1.id}')">
👤 ${p1?.prenom}
</div>

<div class="bg-pink-200 px-4 py-2 rounded cursor-pointer"
onclick="menu('${p2.id}')">
👤 ${p2?.prenom}
</div>

</div>

<div class="flex gap-2 justify-center flex-wrap">
`;

/* CHILDREN */
const childrenSnap = await db.collection("children")
.where("coupleId","==",doc.id)
.get();

childrenSnap.forEach(ch=>{
html += `
<div class="bg-green-200 px-3 py-2 rounded">
👶 ${ch.data().prenom}
</div>`;
});

html += `</div></div>`;

tree.innerHTML += html;

}

/* SHOW ROOT IF NO COUPLE */
if(couplesSnap.empty){
members.forEach(m=>{
tree.innerHTML += `
<div class="bg-blue-100 p-3 rounded mb-2 cursor-pointer"
onclick="menu('${m.id}')">
👤 ${m.prenom}
</div>`;
});
}

}

/* MENU */
function menu(id){

const action = prompt(
"1: Ajouter conjoint\n2: Ajouter enfant"
);

if(action=="1") addSpouse(id);
if(action=="2") addChild(id);

}

</script>

</body>
</html>
