<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 flex justify-between shadow">
<h1 class="font-bold">Genbook 🌳</h1>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-6 flex flex-col items-center">

<button onclick="createFamily()" class="bg-blue-600 text-white px-4 py-2 rounded mb-6">
Créer famille
</button>

<div id="tree" class="relative"></div>

</main>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

<div class="bg-white p-6 rounded w-80">

<h2 class="font-bold mb-4">Ajouter</h2>

<input id="prenom" placeholder="Prénom" class="border p-2 w-full mb-2">

<button onclick="confirmAdd()" class="bg-green-600 text-white w-full p-2 mb-2">
Ajouter
</button>

<button onclick="closeModal()" class="bg-gray-400 text-white w-full p-2">
Annuler
</button>

</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentFamilyId = null;
let members = [];
let selectedPerson = null;
let selectedAction = null;

const tree = document.getElementById("tree");

/* CREATE FAMILY */
async function createFamily(){
const doc = await db.collection("families").add({});
currentFamilyId = doc.id;
loadMembers();
}

/* LOAD */
async function loadMembers(){

const snap = await db.collection("members")
.where("familyId","==",currentFamilyId)
.get();

members = snap.docs.map(d=>({id:d.id,...d.data()}));

renderTree();

}

/* ADD ROOT */
async function addRoot(){
await db.collection("members").add({
familyId: currentFamilyId,
prenom:"Moi"
});
loadMembers();
}

/* BULLE MENU */
function openBubble(id){

document.querySelectorAll(".bubble").forEach(b=>b.remove());

selectedPerson = id;

const el = document.getElementById("person-"+id);

const bubble = document.createElement("div");
bubble.className = "bubble absolute bg-white shadow-lg rounded p-2 text-sm";

bubble.style.top = el.offsetTop - 60 + "px";
bubble.style.left = el.offsetLeft + "px";

bubble.innerHTML = `
<div onclick="chooseAction('son')" class="cursor-pointer">👦 Garçon</div>
<div onclick="chooseAction('daughter')" class="cursor-pointer">👧 Fille</div>
<div onclick="chooseAction('spouse')" class="cursor-pointer">❤️ Conjoint</div>
<div onclick="chooseAction('sibling')" class="cursor-pointer">👨‍👩‍👧 Frère / sœur</div>
`;

tree.appendChild(bubble);

}

/* SELECT ACTION */
function chooseAction(action){
selectedAction = action;
openModal();
}

/* MODAL */
function openModal(){
document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
document.getElementById("modal").classList.add("hidden");
}

/* CONFIRM */
async function confirmAdd(){

const prenom = document.getElementById("prenom").value;

const ref = await db.collection("members").add({
familyId: currentFamilyId,
prenom
});

const newId = ref.id;

/* SPOUSE */
if(selectedAction==="spouse"){
await db.collection("couples").add({
familyId: currentFamilyId,
husbandId: selectedPerson,
wifeId: newId
});
}

/* CHILD */
if(selectedAction==="son" || selectedAction==="daughter"){

const couples = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

let coupleId = null;

couples.forEach(c=>{
const d = c.data();
if(d.husbandId===selectedPerson || d.wifeId===selectedPerson){
coupleId = c.id;
}
});

if(coupleId){
await db.collection("children").add({
coupleId,
prenom
});
}
}

/* SIBLING */
if(selectedAction==="sibling"){
await db.collection("siblings").add({
familyId: currentFamilyId,
personId: selectedPerson,
siblingId: newId
});
}

closeModal();
loadMembers();

}

/* RENDER */
async function renderTree(){

tree.innerHTML = "";

if(members.length===0){
tree.innerHTML = `<button onclick="addRoot()" class="bg-blue-500 text-white px-4 py-2 rounded">Créer racine</button>`;
return;
}

members.forEach(m=>{
tree.innerHTML += `
<div id="person-${m.id}" onclick="openBubble('${m.id}')" 
class="cursor-pointer bg-blue-200 p-3 m-2 inline-block rounded shadow hover:scale-105 transition">
👤 ${m.prenom}
</div>`;
});

}

</script>

</body>
</html>
