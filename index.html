<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 flex justify-between shadow">
<h1 class="font-bold">Genbook 🌳</h1>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-6">

<div class="mb-4">
<button onclick="createFamily()" class="bg-blue-600 text-white px-4 py-2 rounded">
Créer ma famille
</button>
</div>

<div id="tree" class="flex flex-col items-center"></div>

</main>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

<div class="bg-white p-6 rounded w-80">

<h2 class="font-bold mb-4">Ajouter</h2>

<input id="prenom" placeholder="Prénom" class="border p-2 w-full mb-2">
<input id="nom" placeholder="Nom" class="border p-2 w-full mb-2">

<select id="actionType" class="border p-2 w-full mb-2">
<option value="spouse">Conjoint</option>
<option value="child">Enfant</option>
</select>

<button onclick="confirmAdd()" class="bg-green-600 text-white w-full p-2 mb-2">
Ajouter
</button>

<button onclick="closeModal()" class="bg-gray-400 text-white w-full p-2">
Annuler
</button>

</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* VARIABLES */
let currentFamilyId = null;
let members = [];
let selectedPerson = null;

const tree = document.getElementById("tree");

/* CREATE FAMILY */
async function createFamily(){
const doc = await db.collection("families").add({});
currentFamilyId = doc.id;
alert("Famille créée");
}

/* LOAD */
async function loadMembers(){

const snap = await db.collection("members")
.where("familyId","==",currentFamilyId)
.get();

members = snap.docs.map(d=>({id:d.id,...d.data()}));

renderTree();

}

/* ADD ROOT */
async function addRoot(){
await db.collection("members").add({
familyId: currentFamilyId,
prenom:"Moi"
});
loadMembers();
}

/* CLICK PERSON */
function openModal(personId){
selectedPerson = personId;
document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
document.getElementById("modal").classList.add("hidden");
}

/* CONFIRM ADD */
async function confirmAdd(){

const prenom = document.getElementById("prenom").value;
const nom = document.getElementById("nom").value;
const type = document.getElementById("actionType").value;

const ref = await db.collection("members").add({
familyId: currentFamilyId,
prenom,
nom
});

const newId = ref.id;

if(type==="spouse"){

await db.collection("couples").add({
familyId: currentFamilyId,
husbandId: selectedPerson,
wifeId: newId
});

}

if(type==="child"){

const couples = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

let coupleId = null;

couples.forEach(c=>{
const d = c.data();
if(d.husbandId===selectedPerson || d.wifeId===selectedPerson){
coupleId = c.id;
}
});

if(coupleId){
await db.collection("children").add({
coupleId,
prenom
});
}

}

closeModal();
loadMembers();

}

/* RENDER TREE */
async function renderTree(){

tree.innerHTML = "";

if(members.length===0){

tree.innerHTML = `
<button onclick="addRoot()" class="bg-blue-500 text-white px-4 py-2 rounded">
Créer personne racine
</button>
`;

return;
}

const couplesSnap = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

for(const doc of couplesSnap.docs){

const c = doc.data();

const h = members.find(m=>m.id===c.husbandId);
const w = members.find(m=>m.id===c.wifeId);

let html = `
<div class="mb-10 flex flex-col items-center">

<div class="flex gap-6">

<div onclick="openModal('${h.id}')" class="cursor-pointer bg-blue-200 px-4 py-3 rounded shadow hover:scale-105 transition">
👨 ${h.prenom}
</div>

<div onclick="openModal('${w.id}')" class="cursor-pointer bg-pink-200 px-4 py-3 rounded shadow hover:scale-105 transition">
👩 ${w.prenom}
</div>

</div>

<div class="mt-4 flex gap-3">
`;

const childrenSnap = await db.collection("children")
.where("coupleId","==",doc.id)
.get();

childrenSnap.forEach(ch=>{
html += `
<div onclick="openModal('${h.id}')" class="cursor-pointer bg-green-200 px-3 py-2 rounded shadow">
👶 ${ch.data().prenom}
</div>`;
});

html += `</div></div>`;

tree.innerHTML += html;

}

}

</script>

</body>
</html>
