<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 flex justify-between shadow">
<h1 class="font-bold">Genbook 🌳 PRO</h1>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-4 grid md:grid-cols-2 gap-6">

<!-- FAMILLE -->
<div>

<div class="bg-white p-4 rounded shadow mb-4">
<input id="familyName" placeholder="Nom famille" class="border p-2 w-full mb-2">
<button onclick="createFamily()" class="bg-blue-600 text-white w-full p-2 mb-2">Créer</button>

<input id="familyCode" placeholder="Code" class="border p-2 w-full mb-2">
<button onclick="joinFamily()" class="bg-green-600 text-white w-full p-2">Rejoindre</button>
</div>

<!-- AJOUT PERSONNE -->
<div class="bg-white p-4 rounded shadow">

<input id="prenom" placeholder="Prénom" class="border p-2 w-full mb-2">
<input id="nom" placeholder="Nom" class="border p-2 w-full mb-2">
<input id="naissance" type="date" class="border p-2 w-full mb-2">

<select id="sexe" class="border p-2 w-full mb-2">
<option value="">Sexe</option>
<option value="Homme">Homme</option>
<option value="Femme">Femme</option>
</select>

<select id="type" class="border p-2 w-full mb-2">
<option value="root">Personne racine</option>
<option value="spouse">Ajouter conjoint</option>
<option value="child">Ajouter enfant</option>
</select>

<select id="target" class="border p-2 w-full mb-2"></select>

<button onclick="addPerson()" class="bg-purple-600 text-white w-full p-2">Ajouter</button>

</div>

</div>

<!-- ARBRE -->
<div class="bg-white p-4 rounded shadow">
<h2 class="font-bold mb-4">Arbre visuel</h2>
<div id="tree"></div>
</div>

</main>

<script>

/* CONFIG FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a",
storageBucket: "genbook-2ea8a.appspot.com",
messagingSenderId: "541161690715",
appId: "1:541161690715:web:5b2aafcf8af0fa2baf117e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* VARIABLES */
let currentFamilyId = null;
let members = [];
const tree = document.getElementById("tree");

/* LOGOUT */
function logout(){
firebase.auth().signOut();
}

/* CREER FAMILLE */
async function createFamily(){

const name = document.getElementById("familyName").value;

if(!name) return alert("Nom famille");

const code = Math.random().toString(36).substring(2,8).toUpperCase();

const doc = await db.collection("families").add({
name,
code
});

currentFamilyId = doc.id;

alert("Code famille : " + code);

}

/* REJOINDRE */
async function joinFamily(){

const code = document.getElementById("familyCode").value;

const snap = await db.collection("families")
.where("code","==",code)
.get();

if(snap.empty) return alert("Code invalide");

currentFamilyId = snap.docs[0].id;

loadMembers();

}

/* LOAD */
async function loadMembers(){

const snap = await db.collection("members")
.where("familyId","==",currentFamilyId)
.get();

members = snap.docs.map(d=>({id:d.id,...d.data()}));

updateTargets();
renderTree();

}

/* SELECT */
function updateTargets(){

const target = document.getElementById("target");
target.innerHTML = "";

members.forEach(m=>{
target.innerHTML += `<option value="${m.id}">${m.prenom} ${m.nom}</option>`;
});

}

/* AJOUT PERSONNE */
async function addPerson(){

if(!currentFamilyId) return alert("Créer/Rejoindre famille");

const prenom = document.getElementById("prenom").value;
const nom = document.getElementById("nom").value;
const naissance = document.getElementById("naissance").value;
const sexe = document.getElementById("sexe").value;
const type = document.getElementById("type").value;
const targetId = document.getElementById("target").value;

const personRef = await db.collection("members").add({
familyId: currentFamilyId,
prenom,
nom,
naissance,
sexe
});

const personId = personRef.id;

if(type==="spouse"){

const targetP = members.find(m=>m.id===targetId);

await db.collection("couples").add({
familyId: currentFamilyId,
husbandId: targetP.sexe==="Homme"?targetId:personId,
wifeId: targetP.sexe==="Femme"?targetId:personId
});

}

if(type==="child"){

const couples = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

let coupleId = null;

couples.forEach(c=>{
const d = c.data();
if(d.husbandId===targetId || d.wifeId===targetId){
coupleId = c.id;
}
});

if(coupleId){
await db.collection("children").add({
coupleId,
prenom,
sexe
});
}

}

loadMembers();

}

/* RENDER TREE CLEAN */
async function renderTree(){

tree.innerHTML = "";

const couplesSnap = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

if(couplesSnap.empty){

members.forEach(m=>{
tree.innerHTML += `<div class="bg-blue-100 p-2 mb-2 rounded">👤 ${m.prenom}</div>`;
});

return;
}

for(const doc of couplesSnap.docs){

const c = doc.data();

const h = members.find(m=>m.id===c.husbandId);
const w = members.find(m=>m.id===c.wifeId);

let html = `
<div class="flex flex-col items-center mb-8">

<div class="flex items-center gap-4">
<div class="bg-blue-200 px-4 py-2 rounded">👨 ${h?.prenom || "?"}</div>
<div class="w-10 h-1 bg-gray-400"></div>
<div class="bg-pink-200 px-4 py-2 rounded">👩 ${w?.prenom || "?"}</div>
</div>

<div class="w-1 h-6 bg-gray-400"></div>

<div class="flex gap-3 flex-wrap justify-center mt-2">
`;

const childrenSnap = await db.collection("children")
.where("coupleId","==",doc.id)
.get();

childrenSnap.forEach(ch=>{
const d = ch.data();
html += `<div class="bg-green-200 px-3 py-2 rounded">👶 ${d.prenom}</div>`;
});

html += `</div></div>`;

tree.innerHTML += html;

}

}

</script>

</body>
</html>
