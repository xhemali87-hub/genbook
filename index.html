<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Genbook PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body class="bg-gray-100">

<header class="bg-white p-4 flex justify-between shadow">
<h1 class="font-bold">Genbook 🌳 PRO</h1>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>

<main class="p-4 grid md:grid-cols-2 gap-6">

<!-- LEFT -->
<div>

<div class="bg-white p-4 rounded shadow mb-4">

<input id="familyName" placeholder="Nom famille" class="border p-2 w-full mb-2">
<button onclick="createFamily()" class="bg-blue-600 text-white w-full p-2 mb-2">Créer</button>

<input id="familyCode" placeholder="Code" class="border p-2 w-full mb-2">
<button onclick="joinFamily()" class="bg-green-600 text-white w-full p-2">Rejoindre</button>

</div>

<div class="bg-white p-4 rounded shadow">

<input id="prenom" placeholder="Prénom" class="border p-2 w-full mb-2">
<input id="nom" placeholder="Nom" class="border p-2 w-full mb-2">
<input id="naissance" type="date" class="border p-2 w-full mb-2">

<select id="sexe" class="border p-2 w-full mb-2">
<option value="">Sexe</option>
<option value="Homme">Homme</option>
<option value="Femme">Femme</option>
</select>

<select id="type" class="border p-2 w-full mb-2">
<option value="root">Personne racine</option>
<option value="spouse">Ajouter conjoint</option>
<option value="child">Ajouter enfant</option>
</select>

<select id="target" class="border p-2 w-full mb-2"></select>

<button onclick="addPerson()" class="bg-purple-600 text-white w-full p-2">
Ajouter
</button>

</div>

</div>

<!-- RIGHT -->
<div class="bg-white p-4 rounded shadow overflow-x-auto">
<h2 class="font-bold mb-4">Arbre visuel</h2>
<div id="tree"></div>
</div>

</main>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAVbO1_ihA4_l3B0DIAN6e3UX-s9rNLva4",
authDomain: "genbook-2ea8a.firebaseapp.com",
projectId: "genbook-2ea8a"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userId = null;
let currentFamilyId = null;
let members = [];

auth.signInAnonymously();

auth.onAuthStateChanged(user=>{
if(user){
userId = user.uid;
}
});

function logout(){
auth.signOut();
}

function generateCode(){
return Math.random().toString(36).substring(2,8).toUpperCase();
}

function createFamily(){

const name = familyName.value;

if(!name){
alert("Entre un nom");
return;
}

const code = generateCode();

db.collection("families").add({name,code}).then(doc=>{
currentFamilyId = doc.id;
alert("Code famille: "+code);
loadMembers();
});
}

function joinFamily(){

db.collection("families").where("code","==",familyCode.value)
.get().then(s=>{
s.forEach(doc=>{
currentFamilyId = doc.id;
loadMembers();
});
});
}

async function addPerson(){

if(!currentFamilyId){
alert("Crée une famille");
return;
}

const data = {
familyId: currentFamilyId,
prenom: prenom.value,
nom: nom.value,
naissance: naissance.value,
sexe: sexe.value
};

const typeVal = type.value;

const personRef = await db.collection("members").add(data);
const personId = personRef.id;

if(typeVal === "spouse"){

const targetId = target.value;
const targetP = members.find(m=>m.id===targetId);

await db.collection("couples").add({
familyId: currentFamilyId,
husbandId: targetP.sexe==="Homme"?targetId:personId,
wifeId: targetP.sexe==="Femme"?targetId:personId
});
}

if(typeVal === "child"){

const targetId = target.value;

const couplesSnap = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

let coupleId = null;

couplesSnap.forEach(doc=>{
const c = doc.data();
if(c.husbandId===targetId || c.wifeId===targetId){
coupleId = doc.id;
}
});

if(coupleId){

await db.collection("children").add({
coupleId,
prenom: data.prenom,
nom: data.nom,
sexe: data.sexe
});

await db.collection("members").doc(personId).delete();
}

}

loadMembers();
}

function loadMembers(){

db.collection("members").where("familyId","==",currentFamilyId)
.onSnapshot(s=>{

members = [];
target.innerHTML='';

s.forEach(doc=>{
let d=doc.data();
d.id=doc.id;
members.push(d);

let o=document.createElement("option");
o.value=d.id;
o.textContent=d.prenom+" "+d.nom;
target.appendChild(o);
});

renderTree();

});
}

async function renderTree(){

tree.innerHTML = '';

const couplesSnap = await db.collection("couples")
.where("familyId","==",currentFamilyId)
.get();

for(const doc of couplesSnap.docs){

const c = doc.data();

const h = members.find(m=>m.id===c.husbandId);
const w = members.find(m=>m.id===c.wifeId);

let html = `
<div class="flex flex-col items-center mb-10">

  <div class="flex items-center gap-4">

    <div class="bg-blue-200 px-4 py-2 rounded shadow">
      👨 ${h?.prenom || "?"}
    </div>

    <div class="w-10 h-1 bg-gray-400"></div>

    <div class="bg-pink-200 px-4 py-2 rounded shadow">
      👩 ${w?.prenom || "?"}
    </div>

  </div>

  <div class="w-1 h-6 bg-gray-400"></div>

  <div class="flex gap-4 flex-wrap justify-center mt-2">
`;

const childrenSnap = await db.collection("children")
.where("coupleId","==",doc.id)
.get();

childrenSnap.forEach(ch => {
const d = ch.data();

html += `
<div class="bg-green-200 px-3 py-2 rounded shadow">
👶 ${d.prenom}
</div>
`;
});

html += `
  </div>
</div>
`;

tree.innerHTML += html;

}

}

</script>

</body>
</html>
